[project]
name = "duckterm"
# Single source of truth: src/duckterm/__init__.py __version__. A release bumps
# that one line; a beta uses a PEP 440 pre-release suffix (e.g. 0.4.0b1).
dynamic = ["version"]
description = "Run your CLI coding agents in real terminals in the browser — approvals, sub-agent trees, and annotatable responses beside the PTY"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-MIT" }
authors = [{ name = "Utsav Anand" }]
keywords = ["ai", "agents", "claude", "codex", "orchestrator", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/utsavanand/duckterm"
Repository = "https://github.com/utsavanand/duckterm"

[project.scripts]
duckterm = "duckterm.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
    "pytest==8.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "duckterm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckterm = ["hooks/*.sh", "dashboard/index.html", "dashboard/assets/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
strict = true
packages = ["duckterm"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
