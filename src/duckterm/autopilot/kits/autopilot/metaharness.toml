manifest_version = 1
name        = "autopilot"
description = "Flows DuckTerm can run on autopilot"
version     = "0.1.0"
author      = "duckterm"
license     = "MIT"
conflicts_with = []

[[components]]
kind = "skill"
path = "skills/spec-fix"
effects = "read-only"
invocation = "flow-only"
outputs = { spec = { file = "spec.md" } }

[[components]]
kind = "skill"
path = "skills/build-fix"
effects = "workspace"
invocation = "flow-only"

[[components]]
kind = "skill"
path = "skills/check-fix"
effects = "read-only"
invocation = "flow-only"
outputs = { verdict = { choice = ["ok", "broken"] } }

[[components]]
kind = "flow"
path = "flows/issue-to-merge.json"
