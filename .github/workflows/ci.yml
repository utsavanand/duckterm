name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests scripts
      - run: mypy
      - run: python -m pytest
      - run: python scripts/slop_check.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Check dependency security advisories
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify all browser workflows
        run: npm run e2e
        working-directory: web

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: web/test-results/
          retention-days: 7
          if-no-files-found: warn

  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Native transport and launch contracts
        run: swift test --package-path mac
      - name: Native report data and clipboard contracts
        run: |
          scripts/test_mac_bug_report.sh
          scripts/test_mac_clipboard.sh
