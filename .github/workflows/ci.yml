name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests scripts
      - run: mypy
      - run: python -m pytest
      - run: python scripts/slop_check.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Check dependency security advisories
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    # Playwright 1.60 supports Ubuntu 24.04; latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The Azure Ubuntu mirror has taken 12+ minutes to serve Playwright's
      # system packages, leaving too little of the timeout for the tests.
      # Reuse the downloaded .debs and the Chromium build between runs.
      - name: Restore cached Playwright packages and browser
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-debs
            ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ hashFiles('web/package-lock.json') }}
      - name: Reuse cached apt packages
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-debs
          find ~/apt-debs -name '*.deb' -exec sudo cp {} /var/cache/apt/archives/ \;
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Keep apt packages for the cache
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/apt-debs/ \;
      - name: Verify Full browser workflows
        run: npm run e2e
        working-directory: web
        env:
          RD_TEST_EDITION: full
      - name: Verify Lite browser workflows
        run: npm run e2e -- e2e/editions.spec.ts
        working-directory: web
        env:
          RD_TEST_EDITION: lite
      - name: Verify Code browser workflows and PR review
        run: npm run e2e -- e2e/editions.spec.ts e2e/pr-list.spec.ts
        working-directory: web
        env:
          RD_TEST_EDITION: code

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: web/test-results/
          retention-days: 7
          if-no-files-found: warn

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Native transport and launch contracts
        run: swift test --package-path mac
      - name: Native report data and clipboard contracts
        run: |
          scripts/test_mac_bug_report.sh
          scripts/test_mac_clipboard.sh
      - name: Signed app archive extraction
        run: python3 mac/Tests/archive-bundle.py

  ducky-protocol:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Native phone protocol and real TLS host contracts
        run: swift test --package-path ios
      - name: Compile for the iPhone SDK
        run: |
          DUCKY_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -target arm64-apple-ios16.0 -sdk "$DUCKY_SDK" ios/Sources/DuckyCore/*.swift
      - name: Build the native iPhone viewer
        run: xcodebuild -project ios/Ducky.xcodeproj -scheme Ducky -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY=- build
